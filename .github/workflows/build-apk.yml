name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK variant to build"
        required: true
        default: "both"
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-debug:
    if: inputs.variant == 'debug' || inputs.variant == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  build-release:
    if: inputs.variant == 'release' || inputs.variant == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/ci-release.jks \
            -storepass android -keypass android \
            -alias khatkit-ci -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=KhatKit CI, OU=CI, O=KhatKit, L=CI, S=CI, C=CN"
          printf 'storeFile=%s/app/ci-release.jks\nstorePassword=android\nkeyAlias=khatkit-ci\nkeyPassword=android\n' "$GITHUB_WORKSPACE" > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload mapping/proguard info on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: |
            app/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 3
